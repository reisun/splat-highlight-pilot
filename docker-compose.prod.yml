services:
  api:
    build: .
    ports:
      - "127.0.0.1:8030:8000"
    volumes:
      - shared-data:/shared-data
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  shared-data:
    name: shared-data
