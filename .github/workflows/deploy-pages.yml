name: Deploy Web UI to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API HTTPS origin for this deployment
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Write runtime API config
        working-directory: web
        env:
          QUICK_TUNNEL_URL: ${{ inputs.api_base_url || vars.QUICK_TUNNEL_URL }}
        run: |
          mkdir -p public
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const url = new URL(process.env.QUICK_TUNNEL_URL);
          if (url.protocol !== 'https:' || url.username || url.password ||
              url.pathname !== '/' || url.search || url.hash) {
            throw new Error('QUICK_TUNNEL_URL must be an HTTPS origin');
          }
          writeFileSync('public/config.json', JSON.stringify({ apiBaseUrl: url.origin }) + '\n');
          JS

      - name: Build
        working-directory: web
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
